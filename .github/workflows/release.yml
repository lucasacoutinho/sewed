name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: An existing tag to release again, such as v0.0.0-prototype.50
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check the tag against the package version
        run: |
          version="$(node -p "require('./packages/sewed/package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG does not match package version $version" >&2
            exit 1
          fi
      - run: pnpm test
      - run: pnpm format:check
      - run: pnpm website:build
      - run: pnpm check:consumer
      - run: node scripts/release.mjs pack release
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/*.tgz --clobber
          else
            prerelease=""
            case "$TAG" in *-*) prerelease="--prerelease" ;; esac
            gh release create "$TAG" release/*.tgz --title "$TAG" --generate-notes $prerelease
          fi
