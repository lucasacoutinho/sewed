name: Website

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - website/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/website.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter website
      # Publishing is opt-in: set the repository variable SEWED_PAGES to "true" once GitHub Pages
      # is enabled. Until then this workflow only proves the site builds.
      - id: pages
        if: vars.SEWED_PAGES == 'true'
        uses: actions/configure-pages@v6
      - run: pnpm website:build
        env:
          SEWED_SITE_URL: ${{ steps.pages.outputs.base_url }}
      - uses: actions/upload-pages-artifact@v5
        if: vars.SEWED_PAGES == 'true'
        with:
          path: website/dist

  deploy:
    needs: build
    if: vars.SEWED_PAGES == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
